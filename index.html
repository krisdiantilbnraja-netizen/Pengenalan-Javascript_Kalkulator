<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator Ungu</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <main class="kalkulator">
      <div class="layar-bingkai">
        <span class="memori" id="memori">MEMORY</span>
        <div class="layar" id="layar">0</div>
      </div>

      <div class="tombol-grid">
        <button class="tb t2" data-aksi="mrc">MRC</button>
        <button class="tb t3" data-aksi="m-">M-</button>
        <button class="tb t3" data-aksi="m+">M+</button>
        <button class="tb t4" data-aksi="akar">√</button>
        <button class="tb t5" data-aksi="persen">%</button>

        <button class="tb t5" data-aksi="hapus">→</button>
        <button class="tb angka" data-angka="7">7</button>
        <button class="tb angka" data-angka="8">8</button>
        <button class="tb angka" data-angka="9">9</button>
        <button class="tb t3" data-op="/">÷</button>

        <button class="tb t6" data-aksi="ce">CE</button>
        <button class="tb angka" data-angka="4">4</button>
        <button class="tb angka" data-angka="5">5</button>
        <button class="tb angka" data-angka="6">6</button>
        <button class="tb t3" data-op="*">×</button>

        <button class="tb t7" data-aksi="ac">AC</button>
        <button class="tb angka" data-angka="1">1</button>
        <button class="tb angka" data-angka="2">2</button>
        <button class="tb angka" data-angka="3">3</button>
        <button class="tb t3" data-op="-">−</button>

        <button class="tb angka" data-angka="0">0</button>
        <button class="tb angka" data-angka="00">00</button>
        <button class="tb t5" data-aksi="titik">•</button>
        <button class="tb t3" data-aksi="samadengan">=</button>
        <button class="tb t3" data-op="+">+</button>
      </div>
    </main>

    <script src="assets/script.js"></script>
  </body>
</html>
